<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="login-transition.js" defer></script>

    <title>CoffeeBreak | Account Login</title>
    
</head>

<body>

    <div class="container">
        <div class="content">
            <h2 class="logo">Coffee<span class="logo-span">Break</span></h2>

            <div class="text-sci">
                <h2>Welcome!<br><span>To Coffee<span class="logo-span">break</span> website</span></h2>

                <p>This website is make for the moments, sit and take a break</p>
            </div>
        </div>

        <div class="logreg-box">
            <div class="form-box login">
                <form action="#">
                    <h2 class="logreg-box-h2">Sign In</h2>

                    <div class="input-box">
                        <input type="email" required>
                        <label>Email</label>
                    </div>

                    <div class="input-box">
                        <input type="password" required>
                        <label>Password</label>
                    </div>

                    <div class="remember-forgot">
                        <label><input type="checkbox">Remember me</label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn">Sign in</button>

                    <div class="login-register">
                        <p>Don't have an account? <a href="#" class="register-link">Sign up</a></p>
                    </div>
                </form>
            </div>

            <!----------------------Register page----------------------->

            <div class="form-box register">
                <form action="#">
                    <h2>Sign up</h2>

                    <div class="input-box">
                        <input type="text" required>
                        <label>Name</label>
                    </div>

                    <div class="input-box">
                        <input type="email" required>
                        <label>Email</label>
                    </div>

                    <div class="input-box">
                        <input type="password" required>
                        <label>Password</label>
                    </div>

                    <div class="remember-forgot">
                        <label><input type="checkbox">I agree to the terms & conditions</label>
                    </div>

                    <button type="submit" class="btn">Sign Up</button>

                    <div class="login-register">
                        <p>Already have an account? <a href="#" class="login-link">Sign in</a></p>
                    </div>
                </form>
            </div>
        </div>

    </div>
</body>

</html>
